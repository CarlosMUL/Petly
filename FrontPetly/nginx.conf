# nginx.conf — copiar en la raíz de FrontPetly como "nginx.conf"
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia los microservicios del backend
    # El frontend llama a http://localhost:3000/incidents
    # Redirigimos eso a reportes-service dentro de Docker
    location /incidents {
        proxy_pass http://reportes-service:8080/incidents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

version: "3.9"

# ═══════════════════════════════════════════════════════════════
#  docker-compose.yml — Proyecto Petly (SanosySalvos)
#
#  Estructura esperada de carpetas:
#
#  tu-workspace/
#  ├── SanosySalvos/
#  │   ├── coincidencias-service/
#  │   ├── geolocalizacion-service/
#  │   ├── mascotas-service/
#  │   ├── notificaciones-service/
#  │   ├── reportes-service/
#  │   └── usuarios-service/
#  ├── FrontPetly/
#  └── docker-infra/          ← ESTA CARPETA (aquí corre docker compose up)
#      ├── docker-compose.yml
#      ├── nginx.conf          → copiar en FrontPetly/
#      └── init-db/
#          └── init.sql
#
#  Comandos:
#    cd docker-infra
#    docker compose up --build        ← primera vez
#    docker compose up -d --build     ← en segundo plano
#    docker compose down              ← bajar
#    docker compose down -v           ← bajar + borrar BD
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # BASE DE DATOS PostgreSQL
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: petly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bastian10
      POSTGRES_DB: bd_Pruebas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - petly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_Pruebas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # MICROSERVICIOS SPRING BOOT
  # ─────────────────────────────────────────────────────────────

  usuarios-service:
    build:
      context: ../../SanosySalvos/usuarios-service
      dockerfile: Dockerfile
    container_name: petly-usuarios
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Pruebas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bastian10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  mascotas-service:
    build:
      context: ../../SanosySalvos/mascotas-service
      dockerfile: Dockerfile
    container_name: petly-mascotas
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Pruebas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bastian10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: "1234"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  coincidencias-service:
    build:
      context: ../../SanosySalvos/coincidencias-service
      dockerfile: Dockerfile
    container_name: petly-coincidencias
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Pruebas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bastian10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  geolocalizacion-service:
    build:
      context: ../../SanosySalvos/geolocalizacion-service
      dockerfile: Dockerfile
    container_name: petly-geolocalizacion
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Pruebas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bastian10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  notificaciones-service:
    build:
      context: ../../SanosySalvos/notificaciones-service
      dockerfile: Dockerfile
    container_name: petly-notificaciones
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Pruebas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bastian10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  reportes-service:
    build:
      context: ../../SanosySalvos/reportes-service
      dockerfile: Dockerfile
    container_name: petly-reportes
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Pruebas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: bastian10
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  # ─────────────────────────────────────────────────────────────
  # FRONTEND React + Vite + Nginx
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../FrontPetly
      dockerfile: Dockerfile
    container_name: petly-frontend
    ports:
      - "3000:80"
    environment:
      # Token de Mapbox (reemplaza con tu token real)
      VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-tu_token_mapbox_aqui}
    depends_on:
      - reportes-service
      - mascotas-service
      - usuarios-service
    networks:
      - petly-network

# ─────────────────────────────────────────────────────────────
# VOLÚMENES Y RED
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

networks:
  petly-network:
    driver: bridge

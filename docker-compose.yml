version: "3.9"

# ═══════════════════════════════════════════════════════════════
#  docker-compose.yml — Proyecto Petly
#
#  Estructura del repo:
#  Petly/
#  ├── FrontPetly/
#  ├── SanosySalvos/
#  │   ├── usuarios-service/    (puerto 8081)
#  │   ├── reportes-service/    (puerto 8080 → expuesto 8086)
#  │   └── ... (otros servicios comentados por ahora)
#  └── docker-compose.yml   ← ESTE ARCHIVO
#
#  Uso:
#    docker compose up --build        ← primera vez
#    docker compose up -d --build     ← en segundo plano
#    docker compose down              ← bajar todo
#    docker compose down -v           ← bajar + borrar BD
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # 1) BASE DE DATOS — arranca primero
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: petly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 220206Cj*
      POSTGRES_DB: bd_Usuarios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - petly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_Usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # 2) USUARIOS SERVICE — arranca después de postgres
  #    Puerto interno: 8081 (configurado en application.properties)
  #    El frontend llama a: http://localhost:8081/petly/auth/login
  #                         http://localhost:8081/petly/usuarios/registrar
  # ─────────────────────────────────────────────────────────────
  usuarios-service:
    build:
      context: ./SanosySalvos/usuarios-service
      dockerfile: Dockerfile
    container_name: petly-usuarios
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 220206Cj*
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: v5zti3ggthj4radzaynh5q9uoezj66cl
      JWT_EXPIRATION: "3600000"
      SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  # ─────────────────────────────────────────────────────────────
  # 3) REPORTES SERVICE — arranca después de postgres
  #    El frontend llama a: /incidents (via proxy nginx)
  # ─────────────────────────────────────────────────────────────
  reportes-service:
    build:
      context: ./SanosySalvos/reportes-service
      dockerfile: Dockerfile
    container_name: petly-reportes
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 220206Cj*
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  # ─────────────────────────────────────────────────────────────
  # 4) FRONTEND — arranca último
  #    Acceso: http://localhost:3000
  #
  #    El nginx.conf hace proxy de las llamadas del frontend:
  #    /petly/auth/*    → usuarios-service:8081
  #    /petly/usuarios/* → usuarios-service:8081
  #    /incidents       → reportes-service:8080
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./FrontPetly
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-reemplaza_con_tu_token}
        VITE_USE_MOCKS: "false"
    container_name: petly-frontend
    ports:
      - "3000:80"
    depends_on:
      - usuarios-service
      - reportes-service
    networks:
      - petly-network


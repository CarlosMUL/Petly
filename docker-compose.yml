version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: petly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 220206Cj*
      POSTGRES_DB: bd_Usuarios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - petly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_Usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  usuarios-service:
    build:
      context: ./SanosySalvos/usuarios-service
      dockerfile: Dockerfile
    container_name: petly-usuarios
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 220206Cj*
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: v5zti3ggthj4radzaynh5q9uoezj66cl
      JWT_EXPIRATION: "3600000"
      SERVER_PORT: "8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  reportes-service:
    build:
      context: ./SanosySalvos/reportes-service
      dockerfile: Dockerfile
    container_name: petly-reportes
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_Usuarios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 220206Cj*
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petly-network
    restart: on-failure

  frontend:
    build:
      context: ./FrontPetly
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
    container_name: petly-frontend
    ports:
      - "3000:80"
    depends_on:
      - usuarios-service
      - reportes-service
    networks:
      - petly-network

volumes:
  postgres_data:
    driver: local

networks:
  petly-network:
    driver: bridge